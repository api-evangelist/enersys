description: >-
  No rate limits are documented because no public API exists to limit. EnerSys publishes no
  developer portal, no API reference and no machine-readable contract; contract discovery across
  enersys.com, bsp.enersys.com, mptools.enersys.com and xinx.enersys.com found no OpenAPI,
  Swagger, GraphQL, AsyncAPI, MCP or agent-card surface. The only HTTP API observed is the Xinx
  customer portal's internal backend (/api/PowerBi, read from the app's own assets/appsettings.json),
  which is unauthenticated-unreachable — its route answers the SPA HTML shell to anonymous callers —
  and is not a published product. limit_count is an honest zero.
