  reason: no-developer-program
  detail: >-
    EnerSys ships real software as end-user products — the Xinx cloud battery-operations portal,
    the E-Connect app, the Battery Sizing Program and the CARB calculator — but publishes no
    developer surface for any of them: api/developer/developers/docs/apis.enersys.com do not
    resolve, and the Xinx portal's only backend (/api/PowerBi, named in its own
    assets/appsettings.json) answers the Angular HTML shell to anonymous callers.
